<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分子振动可视化 - 综合测试套件</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #00d4ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 32px;
        }
        .test-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .test-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }
        .test-card h3 {
            color: #00d4ff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
        }
        .test-canvas {
            width: 100%;
            height: 300px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: #fff;
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #fff;
        }
        .btn-danger {
            background: linear-gradient(135deg, #eb3349, #f45c43);
            color: #fff;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .result-item {
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pass {
            background: rgba(56, 239, 125, 0.2);
            border: 1px solid rgba(56, 239, 125, 0.4);
        }
        .fail {
            background: rgba(244, 92, 67, 0.2);
            border: 1px solid rgba(244, 92, 67, 0.4);
        }
        .info {
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.4);
        }
        .metric-value {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 16px;
        }
        .slider-container {
            margin: 15px 0;
        }
        .slider-container label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 15px 0;
        }
        .stat-box {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .log-container {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-line {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            transition: width 0.3s;
        }
        #report {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚛️ 分子振动可视化 - 综合测试套件</h1>

        <div class="test-grid">
            <!-- 测试1: 简谐振动幅度验证 -->
            <div class="test-card">
                <h3>📊 测试1: 简谐振动幅度与温度关系</h3>
                <canvas id="amplitudeCanvas" class="test-canvas"></canvas>
                <div class="slider-container">
                    <label>
                        <span>测试温度范围</span>
                        <span id="tempRangeValue">100K - 1000K</span>
                    </label>
                    <input type="range" id="tempTestSlider" min="100" max="2000" value="1000">
                </div>
                <button class="btn btn-primary" onclick="runAmplitudeTest()">运行振动幅度测试</button>
                <div id="amplitudeResults"></div>
            </div>

            <!-- 测试2: FPS帧率测试 -->
            <div class="test-card">
                <h3>⚡ 测试2: Canvas帧率性能测试</h3>
                <canvas id="fpsCanvas" class="test-canvas"></canvas>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-value" id="currentFps">0</div>
                        <div class="stat-label">当前 FPS</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="atomCount">5</div>
                        <div class="stat-label">原子数量</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="avgFps">0</div>
                        <div class="stat-label">平均 FPS</div>
                    </div>
                </div>
                <div class="slider-container">
                    <label>
                        <span>压力测试原子数</span>
                        <span id="atomCountValue">10</span>
                    </label>
                    <input type="range" id="atomSlider" min="5" max="200" value="50">
                </div>
                <button class="btn btn-primary" onclick="startFpsTest()">开始帧率测试</button>
                <button class="btn btn-danger" onclick="stopFpsTest()">停止</button>
                <div id="fpsResults"></div>
            </div>

            <!-- 测试3: 球棍模型空间对齐 -->
            <div class="test-card">
                <h3>🔍 测试3: 球棍模型空间位置对齐</h3>
                <canvas id="alignmentCanvas" class="test-canvas"></canvas>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-value" id="alignmentScore">0%</div>
                        <div class="stat-label">对齐准确率</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="bondCount">0</div>
                        <div class="stat-label">键数量</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="maxError">0</div>
                        <div class="stat-label">最大误差</div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="runAlignmentTest()">运行对齐测试</button>
                <div id="alignmentResults"></div>
            </div>

            <!-- 测试4: 后端API一致性测试 -->
            <div class="test-card">
                <h3>💾 测试4: 后端参数保存与回读</h3>
                <div class="log-container" id="apiLog"></div>
                <div class="progress-bar">
                    <div class="progress-fill" id="apiProgress" style="width: 0%"></div>
                </div>
                <button class="btn btn-primary" onclick="runApiTests()">运行API测试</button>
                <button class="btn btn-success" onclick="clearTestDatabase()">清理测试数据库测试
                </button>
                <div id="apiResults"></div>
            </div>
        </div>

        <!-- 综合测试报告 -->
        <div class="test-card full-width">
            <h3>📋 综合测试报告</h3>
            <button class="btn btn-success" onclick="runAllTests()">运行所有测试</button>
            <button class="btn btn-primary" onclick="exportReport()">导出测试报告</button>
            <div id="report"></div>
        </div>
    </div>

    <script>
        let testResults = {
            amplitude: null,
            fps: null,
            alignment: null,
            api: null
        };

        const atomColors = {
            'H': '#ffffff', 'C': '#404040', 'N': '#3050F8',
            'O': '#FF0D0D', 'S': '#FFFF30', 'Cl': '#1FF01F'
        };

        const moleculeStructures = {
            'H2O': {
                atoms: [
                    { element: 'O', x: 0, y: 0, z: 0 },
                    { element: 'H', x: -1, y: 0.8, z: 0 },
                    { element: 'H', x: 1, y: 0.8, z: 0 }
                ],
                bonds: [[0, 1], [0, 2]]
            },
            'CH4': {
                atoms: [
                    { element: 'C', x: 0, y: 0, z: 0 },
                    { element: 'H', x: 1, y: 1, z: 1 },
                    { element: 'H', x: -1, y: -1, z: 1 },
                    { element: 'H', x: -1, y: 1, z: -1 },
                    { element: 'H', x: 1, y: -1, z: -1 }
                ],
                bonds: [[0, 1], [0, 2], [0, 3], [0, 4]]
            }
        };

        function logApi(message) {
            const log = document.getElementById('apiLog');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.insertBefore(line, log.firstChild);
        }

        function addResult(containerId, status, label, value) {
            const container = document.getElementById(containerId);
            const item = document.createElement('div');
            item.className = `result-item ${status}`;
            item.innerHTML = `<span>${label}</span><span class="metric-value">${value}</span>`;
            container.appendChild(item);
        }

        // ========== 测试1: 简谐振动幅度验证 ==========
        async function runAmplitudeTest() {
            const resultsDiv = document.getElementById('amplitudeResults');
            resultsDiv.innerHTML = '';
            
            const canvas = document.getElementById('amplitudeCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            const maxTemp = parseInt(document.getElementById('tempTestSlider').value);
            const temperatures = [100, 200, 300, 500, 700, 1000, Math.min(1500, maxTemp)];
            const amplitudes = [];
            
            addResult('amplitudeResults', 'info', '测试开始', `测试 ${temperatures.length} 个温度点`);
            
            let allPass = true;
            let prevAmplitude = 0;
            
            for (let i = 0; i < temperatures.length; i++) {
                const T = temperatures[i];
                const amplitude = calculateVibrationAmplitude(T);
                amplitudes.push({ T, amplitude });
                
                if (i > 0 && amplitude <= prevAmplitude) {
                    allPass = false;
                }
                prevAmplitude = amplitude;
                
                await new Promise(r => setTimeout(r, 100));
            }
            
            drawAmplitudeGraph(ctx, amplitudes);
            
            amplitudes.forEach((item, i) => {
                const expectedIncrease = i > 0 ? 
                    (item.amplitude - amplitudes[i-1].amplitude).toFixed(4) : 'N/A';
                addResult('amplitudeResults', 'pass', 
                    `${item.T}K 振幅`, 
                    item.amplitude.toFixed(4));
            });
            
            const linearCorrelation = calculateCorrelation(amplitudes);
            const correlationStatus = linearCorrelation > 0.95 ? 'pass' : 'fail';
            if (linearCorrelation <= 0.95) allPass = false;
            
            addResult('amplitudeResults', correlationStatus, 
                '温度-振幅线性相关系数', linearCorrelation.toFixed(4));
            
            testResults.amplitude = {
                pass: allPass,
                amplitudes,
                correlation: linearCorrelation
            };
            
            addResult('amplitudeResults', allPass ? 'pass' : 'fail', 
                '测试结论', allPass ? '通过 ✓' : '失败 ✗');
        }

        function calculateVibrationAmplitude(temperature) {
            const expectedAmplitude = temperature / 500;
            const timeScale = 0.1;
            return expectedAmplitude * timeScale;
        }

        function calculateCorrelation(data) {
            const n = data.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;
            
            data.forEach(d => {
                sumX += d.T;
                sumY += d.amplitude;
                sumXY += d.T * d.amplitude;
                sumX2 += d.T * d.T;
                sumY2 += d.amplitude * d.amplitude;
            });
            
            const numerator = n * sumXY - sumX * sumY;
            const denominator = Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY));
            return numerator / denominator;
        }

        function drawAmplitudeGraph(ctx, data) {
            const w = ctx.canvas.width;
            const h = ctx.canvas.height;
            const padding = 50;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, w, h);
            
            const maxT = Math.max(...data.map(d => d.T));
            const maxA = Math.max(...data.map(d => d.amplitude));
            
            ctx.strokeStyle = 'rgba(0, 212, 255, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = padding + (h - 2 * padding) * i / 5;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(w - padding, y);
                ctx.stroke();
            }
            
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            data.forEach((d, i) => {
                const x = padding + (w - 2 * padding) * (d.T / maxT);
                const y = h - padding - (h - 2 * padding) * (d.amplitude / maxA);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
            
            data.forEach(d => {
                const x = padding + (w - 2 * padding) * (d.T / maxT);
                const y = h - padding - (h - 2 * padding) * (d.amplitude / maxA);
                ctx.fillStyle = '#7b2cbf';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();
            });
            
            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('温度 (K) →', w / 2, h - 15);
            
            ctx.save();
            ctx.translate(15, h / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('← 振动幅度', 0, 0);
            ctx.restore();
        }

        // ========== 测试2: FPS帧率测试 ==========
        let fpsRunning = false;
        let fpsFrames = 0;
        let fpsStartTime = 0;
        let fpsHistory = [];
        let stressMolecule = null;
        let fpsAnimationId = null;

        function startFpsTest() {
            if (fpsRunning) return;
            
            const atomCount = parseInt(document.getElementById('atomSlider').value);
            document.getElementById('atomCount').textContent = atomCount;
            document.getElementById('atomCountValue').textContent = atomCount;
            
            stressMolecule = generateLargeMolecule(atomCount);
            
            fpsRunning = true;
            fpsFrames = 0;
            fpsStartTime = performance.now();
            fpsHistory = [];
            
            const resultsDiv = document.getElementById('fpsResults');
            resultsDiv.innerHTML = '';
            
            addResult('fpsResults', 'info', '压力测试开始', `${atomCount} 个原子');
            
            measureFps();
            fpsRenderLoop();
        }

        function stopFpsTest() {
            fpsRunning = false;
            if (fpsAnimationId) {
                cancelAnimationFrame(fpsAnimationId);
            }
            
            const avgFps = fpsHistory.reduce((a, b) => a + b, 0) / fpsHistory.length;
            const minFps = Math.min(...fpsHistory);
            const maxFps = Math.max(...fpsHistory);
            
            document.getElementById('avgFps').textContent = avgFps.toFixed(1);
            
            const fpsPass = avgFps >= 30;
            const minPass = minFps >= 20;
            
            addResult('fpsResults', avgFps >= 50 ? 'pass' : (avgFps >= 30 ? 'info' : 'fail'),
                '平均 FPS', avgFps.toFixed(1));
            addResult('fpsResults', minFps >= 30 ? 'pass' : (minFps >= 20 ? 'info' : 'fail'),
                '最低 FPS', minFps.toFixed(1));
            addResult('fpsResults', 'info', '最高 FPS', maxFps.toFixed(1));
            
            testResults.fps = {
                pass: fpsPass && minPass,
                avgFps,
                minFps,
                maxFps,
                atomCount: stressMolecule.atoms.length
            };
            
            addResult('fpsResults', testResults.fps.pass ? 'pass' : 'fail',
                '测试结论', testResults.fps.pass ? '通过 ✓' : '失败 ✗');
        }

        function measureFps() {
            if (!fpsRunning) return;
            
            const now = performance.now();
            fpsFrames++;
            
            if (now - fpsStartTime >= 1000) {
                const currentFps = Math.round(fpsFrames * 1000 / (now - fpsStartTime));
                fpsHistory.push(currentFps);
                document.getElementById('currentFps').textContent = currentFps;
                fpsFrames = 0;
                fpsStartTime = now;
            }
            
            if (fpsHistory.length < 10) {
                setTimeout(measureFps, 100);
            } else {
                stopFpsTest();
            }
        }

        function generateLargeMolecule(count) {
            const molecule = { atoms: [], bonds: [] };
            const elements = ['H', 'C', 'N', 'O', 'S'];
            
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 8;
                const radius = 2 + (i % 5) * 0.5;
                molecule.atoms.push({
                    element: elements[i % elements.length],
                    x: Math.cos(angle) * radius,
                    y: Math.sin(angle * 0.7) * radius,
                    z: Math.sin(angle) * radius,
                    vx: 0, vy: 0, vz: 0,
                    phase: Math.random() * Math.PI * 2
                });
                if (i > 0) {
                    molecule.bonds.push([i - 1, i]);
                }
            }
            return molecule;
        }

        function fpsRenderLoop() {
            if (!fpsRunning) return;
            
            const canvas = document.getElementById('fpsCanvas');
            const ctx = canvas.getContext('2d');
            
            if (canvas.width !== canvas.offsetWidth) {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
            
            const w = canvas.width;
            const h = canvas.height;
            
            ctx.fillStyle = 'rgba(10, 22, 40, 0.3)';
            ctx.fillRect(0, 0, w, h);
            
            const time = performance.now() * 0.001;
            const T = 500;
            const amplitude = T / 500 * 0.1;
            
            stressMolecule.atoms.forEach((atom, i) => {
                const freq = 2 + i * 0.1;
                const vx = Math.sin(time * freq + atom.phase) * amplitude;
                const vy = Math.cos(time * freq * 0.7 + atom.phase) * amplitude;
                
                const scale = 30;
                const px = w / 2 + (atom.x + vx) * scale;
                const py = h / 2 + (atom.y + vy) * scale;
                
                if (px > -50 && px < w + 50 && py > -50 && py < h + 50) {
                    ctx.fillStyle = atomColors[atom.element] || '#888';
                    ctx.beginPath();
                    ctx.arc(px, py, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            fpsAnimationId = requestAnimationFrame(fpsRenderLoop);
        }

        // ========== 测试3: 球棍模型空间对齐 ==========
        async function runAlignmentTest() {
            const resultsDiv = document.getElementById('alignmentResults');
            resultsDiv.innerHTML = '';
            
            const canvas = document.getElementById('alignmentCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            addResult('alignmentResults', 'info', '测试开始', '验证球棍模型空间位置');
            
            const molecules = ['H2O', 'CH4'];
            let totalBonds = 0;
            let correctAlignments = 0;
            let maxError = 0;
            
            for (const molName of molecules) {
                const mol = JSON.parse(JSON.stringify(moleculeStructures[molName]));
                totalBonds += mol.bonds.length;
                
                drawAlignmentMolecule(ctx, mol);
                
                mol.bonds.forEach(bond => {
                    const atom1 = mol.atoms[bond[0]];
                    const atom2 = mol.atoms[bond[1]];
                    
                    const dx = atom2.x - atom1.x;
                    const dy = atom2.y - atom1.y;
                    const dz = atom2.z - atom1.z;
                    const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    
                    const expectedDistance = 1.5;
                    const error = Math.abs(distance - expectedDistance);
                    maxError = Math.max(maxError, error);
                    
                    if (error < 1.0) {
                        correctAlignments++;
                    }
                });
                
                await new Promise(r => setTimeout(r, 500));
            }
            
            const accuracy = (correctAlignments / totalBonds * 100);
            
            document.getElementById('alignmentScore').textContent = accuracy.toFixed(1) + '%';
            document.getElementById('bondCount').textContent = totalBonds;
            document.getElementById('maxError').textContent = maxError.toFixed(4);
            
            addResult('alignmentResults', 'info', '测试分子数', molecules.length);
            addResult('alignmentResults', 'info', '总键数', totalBonds);
            addResult('alignmentResults', accuracy >= 90 ? 'pass' : 'fail',
                '对齐准确率', accuracy.toFixed(1) + '%');
            addResult('alignmentResults', maxError < 0.5 ? 'pass' : 'fail',
                '最大位置误差', maxError.toFixed(4));
            
            testResults.alignment = {
                pass: accuracy >= 90 && maxError < 0.5,
                accuracy,
                maxError,
                totalBonds
            };
            
            addResult('alignmentResults', testResults.alignment.pass ? 'pass' : 'fail',
                '测试结论', testResults.alignment.pass ? '通过 ✓' : '失败 ✗');
        }

        function drawAlignmentMolecule(ctx, mol) {
            const w = ctx.canvas.width;
            const h = ctx.canvas.height;
            const scale = 60;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, w, h);
            
            mol.bonds.forEach(bond => {
                const a1 = mol.atoms[bond[0]];
                const a2 = mol.atoms[bond[1]];
                
                ctx.strokeStyle = '#00d4ff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(w/2 + a1.x * scale, h/2 + a1.y * scale);
                ctx.lineTo(w/2 + a2.x * scale, h/2 + a2.y * scale);
                ctx.stroke();
            });
            
            mol.atoms.forEach((atom, i) => {
                const px = w/2 + atom.x * scale;
                const py = h/2 + atom.y * scale;
                
                ctx.fillStyle = atomColors[atom.element];
                ctx.beginPath();
                ctx.arc(px, py, 15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#38ef7d';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(px, py, 20, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(i.toString(), px, py);
            };
        }

        // ========== 测试4: 后端API测试 ==========
        async function runApiTests() {
            const resultsDiv = document.getElementById('apiResults');
            resultsDiv.innerHTML = '';
            const progress = document.getElementById('apiProgress');
            
            addResult('apiResults', 'info', 'API测试开始', '连接到后端...');
            logApi('开始API连接测试...');
            
            const testConfigs = [
                { formula: 'H2O', temperature: 300 },
                { formula: 'CO2', temperature: 500 },
                { formula: 'CH4', temperature: 750 },
                { formula: 'NH3', temperature: 1000 }
            ];
            
            let savedIds = [];
            let allPass = true;
            let passed = 0;
            let failed = 0;
            
            for (let i = 0; i < testConfigs.length; i++) {
                progress.style.width = ((i + 1) / testConfigs.length * 100) + '%';
                
                const config = testConfigs[i];
                logApi(`测试配置: ${config.formula} @ ${config.temperature}K`);
                
                try {
                    const saveResponse = await fetch('/api/configs', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });
                    
                    if (!saveResponse.ok) throw new Error('保存失败');
                    
                    const saved = await saveResponse.json();
                    savedIds.push(saved.id);
                    
                    if (saved.formula !== config.formula || saved.temperature !== config.temperature) {
                        throw new Error('保存数据不一致');
                    }
                    
                    logApi(`✓ 保存成功: ID=${saved.id}`);
                    addResult('apiResults', 'pass', 
                        `保存 ${config.formula}`, `ID: ${saved.id}`);
                    passed++;
                    
                } catch (e) {
                    logApi(`✗ 保存失败: ${e.message}`);
                    addResult('apiResults', 'fail', 
                        `保存 ${config.formula}`, e.message);
                    allPass = false;
                    failed++;
                }
                
                await new Promise(r => setTimeout(r, 300));
            }
            
            logApi('验证数据回读...');
            try {
                const getResponse = await fetch('/api/configs');
                const allConfigs = await getResponse.json();
                
                addResult('apiResults', 'info', '数据库记录数', allConfigs.length);
                
                const matchCount = testConfigs.filter(config =>
                    allConfigs.some(c => 
                        c.formula === config.formula && c.temperature === config.temperature)
                ).length;
                
                if (matchCount === testConfigs.length) {
                    addResult('apiResults', 'pass', '数据一致性验证', '全部匹配 ✓');
                    logApi('✓ 所有配置数据一致');
                } else {
                    addResult('apiResults', 'fail', '数据一致性验证', `${matchCount}/${testConfigs.length} 匹配');
                    logApi(`✗ 数据不匹配: ${matchCount}/${testConfigs.length}`);
                    allPass = false;
                }
                
            } catch (e) {
                logApi(`✗ 获取配置失败: ${e.message}`);
                addResult('apiResults', 'fail', '获取配置', e.message);
                allPass = false;
            }
            
            testResults.api = {
                pass: allPass,
                passed,
                failed,
                total: testConfigs.length
            };
            
            addResult('apiResults', allPass ? 'pass' : 'fail',
                '测试结论', allPass ? '通过 ✓' : '失败 ✗');
            logApi('API测试完成');
        }

        async function clearTestDatabase() {
            logApi('清理测试数据...');
            try {
                const response = await fetch('/api/configs');
                const configs = await response.json();
                
                for (const config of configs) {
                    await fetch(`/api/configs/${config.id}`, { method: 'DELETE' });
                }
                
                logApi(`✓ 已清理 ${configs.length} 条记录`);
                document.getElementById('apiResults').innerHTML = '';
                addResult('apiResults', 'pass', '数据库清理', `${configs.length} 条记录已删除`);
            } catch (e) {
                logApi(`✗ 清理失败: ${e.message}`);
            }
        }

        // ========== 综合测试报告 ==========
        async function runAllTests() {
            document.getElementById('report').textContent = '正在运行所有测试...\n';
            
            await runAmplitudeTest();
            await new Promise(r => setTimeout(r, 500));
            
            startFpsTest();
            await new Promise(r => {
                const check = setInterval(() => {
                    if (!fpsRunning) {
                        clearInterval(check);
                        r();
                    }
                }, 500);
            });
            
            await runAlignmentTest();
            await new Promise(r => setTimeout(r, 500));
            
            await runApiTests();
            await new Promise(r => setTimeout(r, 500));
            
            generateReport();
        }

        function generateReport() {
            const report = [];
            report.push('='.repeat(60));
            report.push('    分子振动可视化 - 综合测试报告');
            report.push('='.repeat(60));
            report.push('');
            report.push(`测试时间: ${new Date().toLocaleString()}`);
            report.push('');
            
            const testNames = {
                amplitude: '简谐振动幅度测试',
                fps: 'Canvas帧率性能测试',
                alignment: '球棍模型空间对齐测试',
                api: '后端API一致性测试'
            };
            
            let passCount = 0;
            let totalCount = 0;
            
            for (const [key, name] of Object.entries(testNames)) {
                totalCount++;
                const result = testResults[key];
                const status = result?.pass ? '✓ 通过' : '✗ 失败';
                if (result?.pass) passCount++;
                
                report.push(`[${status}] ${name}`);
                
                if (result) {
                    switch(key) {
                        case 'amplitude':
                            report.push(`  相关系数: ${result.correlation.toFixed(4)}`);
                            break;
                        case 'fps':
                            report.push(`  平均FPS: ${result.avgFps.toFixed(1)}`);
                            report.push(`  最低FPS: ${result.minFps.toFixed(1)}`);
                            report.push(`  原子数量: ${result.atomCount}`);
                            break;
                        case 'alignment':
                            report.push(`  准确率: ${result.accuracy.toFixed(1)}%`);
                            report.push(`  最大误差: ${result.maxError.toFixed(4)}`);
                            break;
                        case 'api':
                            report.push(`  通过: ${result.passed}/${result.total}`);
                            break;
                    }
                }
                report.push('');
            }
            
            report.push('='.repeat(60));
            const overallPass = passCount === totalCount;
            report.push(`总体结果: ${overallPass ? '✓ 全部通过' : '✗ 部分失败'}`);
            report.push(`通过率: ${passCount}/${totalCount} (${(passCount/totalCount*100).toFixed(1)}%)`);
            report.push('='.repeat(60));
            
            document.getElementById('report').textContent = report.join('\n');
        }

        function exportReport() {
            if (!document.getElementById('report').textContent) {
                generateReport();
            }
            
            const reportText = document.getElementById('report').textContent;
            const blob = new Blob([reportText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `molecule-test-report-${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('atomSlider').addEventListener('input', function() {
            document.getElementById('atomCountValue').textContent = this.value;
        });

        document.getElementById('tempTestSlider').addEventListener('input', function() {
            document.getElementById('tempRangeValue').textContent = `100K - ${this.value}K`;
        });
    </script>
</body>
